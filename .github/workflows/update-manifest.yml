name: Actualizar Catálogo de Imágenes

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'img/**'
  workflow_dispatch:

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4
      
      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: 📸 Generar manifest.json
        run: node generate-manifest.js
      
      - name: 📤 Commit y push de manifest.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add manifest.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Actualizar catálogo de imágenes [skip ci]"
          git push